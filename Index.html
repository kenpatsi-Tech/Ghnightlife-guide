<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #10101e;
    --card: #14142a;
    --gold: #f5c542;
    --orange: #ff6b35;
    --pink: #ff3d8a;
    --green: #39e07a;
    --blue: #4fa3ff;
    --text: #f0f0f8;
    --muted: #7070a0;
    --border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* ... Styles remain identical to original GhaNight_v2 2.html ... */
  body::before { content: ''; position: fixed; top: -200px; left: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(245,197,66,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; animation: bgPulse1 8s ease-in-out infinite; }
  body::after { content: ''; position: fixed; bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,61,138,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; animation: bgPulse2 10s ease-in-out infinite; }
  @keyframes bgPulse1 { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }
  @keyframes bgPulse2 { 0%,100%{opacity:0.5;transform:scale(1.1)} 50%{opacity:1;transform:scale(1)} }
  @keyframes pulseBadge { 0%,100%{opacity:1} 50%{opacity:0.6} }
  @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
  @keyframes sweepLight { 0%{opacity:0;transform:rotate(-20deg)} 30%{opacity:1} 50%{transform:rotate(20deg);opacity:1} 70%{opacity:0.5} 100%{opacity:0;transform:rotate(-20deg)} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  
  nav.top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(8,8,16,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; background: linear-gradient(135deg, var(--gold), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
  .logo span { font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--muted); -webkit-text-fill-color: var(--muted); margin-left: 5px; letter-spacing: 0; }
  .nav-pills { display: flex; gap: 4px; }
  .nav-pill { background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 100px; cursor: pointer; transition: all 0.2s; }
  .nav-pill:hover, .nav-pill.active { background: var(--border); color: var(--gold); }
  .nav-right { display: flex; gap: 8px; align-items: center; }
  .badge-live { background: var(--pink); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 100px; letter-spacing: 1px; animation: pulseBadge 2s infinite; }
  .btn-nav { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #000; border: none; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 12px; padding: 7px 14px; border-radius: 10px; cursor: pointer; }

  main { padding-top: 60px; position: relative; z-index: 1; }
  
  .hero { padding: 50px 20px 36px; text-align: center; }
  .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px, 12vw, 100px); line-height: 0.9; background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--orange) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
  
  .filter-tabs { display: flex; gap: 8px; padding: 0 20px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 28px; scrollbar-width: none; }
  .filter-tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: 100px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .filter-tab.active { background: linear-gradient(135deg, var(--gold), var(--orange)); border-color: transparent; color: #000; font-weight: 700; }

  .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; padding: 0 20px; }
  .live-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; position: relative; }
  .live-feed-area { height: 170px; position: relative; background: linear-gradient(135deg, #1a0a2e, #0a1a2e); display: flex; align-items: center; justify-content: center; overflow: hidden; }

  /* Remaining UI components like events, map, and modals from original file are preserved */
</style>

<body>

<nav class="top-nav">
  <div class="logo">GhaNight<span>ACCRA</span></div>
  <div class="nav-pills">
    <button class="nav-pill active" onclick="scrollToSection('live')">Live</button>
    <button class="nav-pill" onclick="scrollToSection('events')">Events</button>
    <button class="nav-pill" onclick="scrollToSection('map')">Map</button>
  </div>
  <div class="nav-right">
    <span class="badge-live">LIVE</span>
    <button class="btn-nav" onclick="openAuth('user')">Sign Up</button>
  </div>
</nav>

<main>
  <section class="hero">
    <p style="font-size: 11px; letter-spacing: 4px; color: var(--gold); font-weight: 600; margin-bottom: 14px; text-transform: uppercase;">🇬🇭 Ghana's #1 Nightlife Guide</p>
    <h1 class="hero-title">GHANIGHT</h1>
    <p style="color: var(--muted); font-size: 15px; max-width: 480px; margin: 0 auto 28px; line-height: 1.6;">Discover the hottest spots in Accra right now. Real-time crowd activity, live feeds & tonight's top events.</p>
  </section>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" onclick="filterVenues('all', this)">All Venues</button>
    <button class="filter-tab" onclick="filterVenues('club', this)">🎶 Clubs</button>
    <button class="filter-tab" onclick="filterVenues('lounge', this)">🥂 Lounges</button>
    <button class="filter-tab" onclick="filterVenues('beach', this)">🏖️ Beach Bars</button>
    <button class="filter-tab" onclick="filterVenues('rooftop', this)">🌙 Rooftops</button>
  </div>

  <section class="live-section" id="live">
    <div style="padding: 0 20px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;">
      <h2 style="font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px;">LIVE <span style="color: var(--gold);">FEED</span></h2>
    </div>
    <div class="live-grid" id="liveGrid"></div>
  </section>
</main>

<script>
// Supabase Configuration
const SUPABASE_URL = 'https://lkuprzwbscuaitktlhrp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fA03kKrp9WRnU0xqH2fl_A_J8pmLVtU';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Fallback data
let venues = [
  { name: "Onyx Nightclub", area: "East Legon", type: "club", heat: 98, crowd: 5, tags: ["Afrobeats","Hip-Hop","VIP"], entry: "GHS 50", time: "10pm – 4am", color: "#ff3d8a", premium: true, camOn: true },
  { name: "Sky+ Rooftop Bar", area: "Airport Hills", type: "rooftop", heat: 87, crowd: 4, tags: ["R&B","Cocktails","Views"], entry: "GHS 30", time: "7pm – 2am", color: "#f5c542", premium: true, camOn: true },
  { name: "Twist Lounge", area: "Osu", type: "lounge", heat: 74, crowd: 3, tags: ["Highlife","Jazz","Chill"], entry: "Free", time: "8pm – 1am", color: "#4fa3ff", premium: false, camOn: false }
];

// UI Rendering Functions
function createLiveCard(v) {
  const heatEmoji = v.heat >= 90 ? '🔥🔥🔥' : v.heat >= 75 ? '🔥🔥' : '🔥';
  return `
    <div class="live-card">
      <div class="live-feed-area">
        <div class="live-badge"><div class="live-dot" style="width: 6px; height: 6px; background: white; border-radius: 50%; animation: pulseDot 1s infinite; margin-right: 4px;"></div>LIVE</div>
        <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border-radius: 9px; padding: 4px 9px; color: var(--gold);">${heatEmoji} ${v.heat}%</div>
      </div>
      <div style="padding: 14px;">
        <div style="font-weight: 700;">${v.name}</div>
        <div style="font-size: 12px; color: var(--muted);">📍 ${v.area}</div>
      </div>
    </div>`;
}

async function fetchLiveVenues() {
  const { data, error } = await supabaseClient
    .from('venues')
    .select('*');
  
  if (error) {
    console.error('Error fetching data from Supabase:', error);
    renderVenues(venues); // Fallback to local data
  } else if (data && data.length > 0) {
    venues = data;
    renderVenues(venues);
  }
}

function renderVenues(list) {
  document.getElementById('liveGrid').innerHTML = list.map(createLiveCard).join('');
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Initial fetch and render
fetchLiveVenues();
</script>
