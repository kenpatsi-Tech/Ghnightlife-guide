<!DOCTYPE html>
<html>
<head>
    <title>GhaNight - Live Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; border-radius: 10px; }
        .status-busy { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>GhaNight Live Navigation</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on Accra
        const map = L.map('map').setView([5.6037, -0.1870], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Fetch data from your Render Backend
        async function loadVenues() {
            try {
                const response = await fetch('YOUR_RENDER_URL/venues');
                const venues = await response.json();

                venues.forEach(venue => {
                    L.marker([venue.latitude, venue.longitude])
                        .addTo(map)
                        .bindPopup(`<b>${venue.name}</b><br>Status: ${venue.crowd_status}`);
                });
            } catch (err) {
                console.error("Error loading map markers:", err);
            }
        }

        loadVenues();
    </script>
</body>
</html>
