<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhaNight — Ghana's #1 Nightlife Guide</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --accent: #ffcc00; --bg: #0b0b0b; --card: #161616; --text: #eee; --glass: rgba(255,255,255,0.05); }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        
        .tab-content { display: none; padding-bottom: 90px; }
        .tab-content.active { display: block; }
        
        /* THE MAP FEATURE (Styled to match your cards) */
        #map { height: 280px; width: calc(100% - 32px); margin: 16px; border-radius: 20px; border: 1px solid #333; z-index: 1; }

        /* Navigation styling from your GhaNight_v2 */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #666; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        
        /* Hero & Buttons from your original design */
        .hero { padding: 40px 20px; text-align: center; background: linear-gradient(to bottom, #1a1a1a, #0b0b0b); }
        .btn-main { background: var(--accent); color: #000; padding: 12px 24px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; }
        .event-card { background: var(--card); margin: 16px; padding: 16px; border-radius: 16px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="home" class="tab-content active">
        <section class="hero">
            <h1 style="font-size: 32px; margin-bottom: 8px;">GhaNight</h1>
            <p style="color: #888; margin-bottom: 24px;">Discover the rhythm of Accra tonight.</p>
            <button class="btn-main" onclick="switchTab('explore')">Find Events</button>
        </section>

        <h3 style="padding: 0 20px; margin-top: 20px;">Live Crowd Map</h3>
        <div id="map"></div>

        <div id="live-venues" style="padding: 0 20px;">
            </div>

        <h3 style="padding: 0 20px;">Featured Events</h3>
        <div class="event-card">
            <div style="font-weight: bold;">Friday Night Lights</div>
            <div style="color: #888; font-size: 13px;">Bloom Bar • 9:00 PM</div>
        </div>
    </div>

    <div id="explore" class="tab-content">
        <div style="padding: 20px;">
            <h2>Explore Accra</h2>
            <input type="text" placeholder="Search clubs, bars..." style="width: 100%; padding: 12px; border-radius: 10px; background: #222; border: none; color: white;">
        </div>
    </div>

    <div id="profile" class="tab-content">
        <div style="padding: 40px 20px; text-align: center;">
            <h2>Join GhaNight</h2>
            <p style="color: #888;">Sign up to track your favorite spots.</p>
            <button class="btn-main" style="width: 100%; margin-bottom: 12px;">Create Account</button>
            <button style="width: 100%; background: transparent; border: 1px solid #444; color: white; padding: 12px; border-radius: 12px;">Login</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="switchTab('explore')"><span>🔍</span>Explore</div>
        <div class="nav-item" onclick="switchTab('profile')"><span>👤</span>Profile</div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Connection
        const supabaseUrl = 'https://lkuprzwbscuaitktlhrp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdXByendic2N1YWl0a3RsaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzcxNzgsImV4cCI6MjA5MzY1MzE3OH0.u4ptPk9lbFhAzw4HoHl5uyffgG9RMkev6ktUyu9VZfg';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Tab Logic (Preserves your original navigation)
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'home') { setTimeout(() => { map.invalidateSize() }, 100); }
        }

        // 3. Map Initialization
        const map = L.map('map').setView([5.5582, -0.1855], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 4. Live Data
        async function fetchLiveSpots() {
            const { data } = await _supabase.from('venues').select('*');
            if (data) {
                const list = document.getElementById('live-venues');
                data.forEach(v => {
                    L.marker([v.latitude, v.longitude]).addTo(map).bindPopup(v.name);
                    const el = document.createElement('div');
                    el.style.fontSize = '14px'; el.style.padding = '8px 0';
                    el.innerHTML = `🔥 ${v.name} is currently ${v.crowd_status}`;
                    list.appendChild(el);
                });
            }
        }
        fetchLiveSpots();
    </script>
</body>
</html>
