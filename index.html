<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhaNight — Ghana's #1 Nightlife Guide</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  :root { --bg:#080810; --surface:#10101e; --card:#14142a; --gold:#f5c542; --orange:#ff6b35; --pink:#ff3d8a; --text:#f0f0f8; --muted:#7070a0; --border:rgba(255,255,255,0.06); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

  /* Tab Switching Logic */
  .tab-content { display: none; padding-bottom: 90px; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Map Styling - Integrated into Home Tab */
  #ghanight-map { height: 350px; width: calc(100% - 40px); margin: 20px; border-radius: 18px; border: 1px solid var(--border); z-index: 1; }

  /* Navigation (Matching your screenshots) */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: rgba(8,8,16,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 20px; }
  .bnav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--muted); background: none; border: none; font-size: 10px; transition: 0.3s; }
  .bnav-item.active { color: var(--gold); }
  .bnav-icon { font-size: 20px; }

  /* Original Hero & UI Elements */
  .hero { padding: 40px 20px; }
  .hero-title { font-size: 42px; font-weight: 900; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .btn-main { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #000; padding: 14px 28px; border-radius: 12px; font-weight: 800; border: none; width: 100%; cursor: pointer; }
  
  /* Toast Notification */
  .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #1a1a2e; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--gold); opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; }
  .toast.show { opacity: 1; bottom: 100px; }
</style>
</head>
<body>

  <div id="home" class="tab-content active">
    <div class="hero">
      <p style="color:var(--gold); font-size: 12px; letter-spacing: 2px;">LIVE IN ACCRA</p>
      <h1 class="hero-title">GHANIGHT</h1>
    </div>

    <div id="ghanight-map"></div>

    <div style="padding: 20px;">
      <h3>Featured Events</h3>
      <div style="background:var(--card); padding:15px; border-radius:15px; margin-top:10px; border:1px solid var(--border);">
        <div style="color:var(--gold); font-size:12px;">TONIGHT</div>
        <div style="font-weight:bold; font-size:18px;">Afro-Chill Fridays</div>
        <div style="color:var(--muted); font-size:14px;">Front/Back • 10:00 PM</div>
      </div>
    </div>
  </div>

  <div id="explore" class="tab-content">
    <div style="padding:40px 20px;">
      <h2>Explore Accra</h2>
      <input type="text" placeholder="Search clubs, bars..." style="width:100%; padding:15px; border-radius:12px; background:var(--card); border:1px solid var(--border); color:white; margin-top:20px;">
    </div>
  </div>

  <div id="profile" class="tab-content">
    <div style="padding:60px 20px; text-align:center;">
      <div style="width:80px; height:80px; background:var(--card); border-radius:50%; margin:0 auto 20px;"></div>
      <h2>Join GhaNight</h2>
      <p style="color:var(--muted); margin-bottom:30px;">Sign up to rsvp and track crowd levels.</p>
      <button class="btn-main">Create Account</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bnav-item active" onclick="switchTab('home', this)"><span class="bnav-icon">🏠</span><span>Home</span></button>
    <button class="bnav-item" onclick="switchTab('explore', this)"><span class="bnav-icon">🔍</span><span>Explore</span></button>
    <button class="bnav-item" onclick="switchTab('profile', this)"><span class="bnav-icon">👤</span><span>Profile</span></button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SUPABASE_URL = 'https://lkuprzwbscuaitktlhrp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdXByendic2N1YWl0a3RsaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzcxNzgsImV4cCI6MjA5MzY1MzE3OH0.u4ptPk9lbFhAzw4HoHl5uyffgG9RMkev6ktUyu9VZfg';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let leafletMap = null;

    // Tab Switching
    function switchTab(id, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
      
      document.getElementById(id).classList.add('active');
      el.classList.add('active');

      if(id === 'home' && leafletMap) {
          setTimeout(() => { leafletMap.invalidateSize() }, 100);
      }
    }

    // Map Setup
    function initMap() {
      leafletMap = L.map('ghanight-map', { zoomControl: false }).setView([5.6037, -0.1870], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(leafletMap);
      loadVenues();
    }

    async function loadVenues() {
      const { data } = await _supabase.from('venues').select('*');
      if (data) {
        data.forEach(v => {
          const m = L.marker([v.latitude, v.longitude]).addTo(leafletMap);
          m.bindPopup(`
            <div style="color:#000;">
              <b>${v.name}</b><br>
              Status: ${v.crowd_status}<br>
              <button onclick="checkIn('${v.id}', '${v.name}')" style="margin-top:10px; background:#f5c542; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Check In</button>
            </div>
          `);
        });
      }
    }

    async function checkIn(id, name) {
      showToast(`Checking into ${name}...`);
      const { error } = await _supabase.from('checkins').insert([{ venue_id: id, venue_name: name }]);
      if (!error) showToast(`🔥 You're checked in at ${name}!`);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    window.onload = initMap;
  </script>
</body>
</html>
