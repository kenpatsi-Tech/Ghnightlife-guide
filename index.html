<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhaNight | Live Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: white; }
        #map { height: 75vh; width: 100%; border-bottom: 2px solid #333; }
        .info-panel { padding: 20px; text-align: center; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; }
        .busy { background: #ff4444; color: white; }
        .normal { background: #00C851; color: white; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="info-panel">
        <h1>GhaNight Live</h1>
        <p>Real-time vibes across Accra.</p>
        <div id="venue-feed">Connecting to Supabase...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Supabase with your key
        const SB_URL = 'https://lkuprzwbscuaitktlhrp.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdXByendic2N1YWl0a3RsaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzcxNzgsImV4cCI6MjA5MzY1MzE3OH0.u4ptPk9lbFhAzw4HoHl5uyffgG9RMkev6ktUyu9VZfg';
        
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // Initialize Map (Centered on Accra)
        const map = L.map('map').setView([5.5500, -0.1800], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        async function getLiveUpdates() {
            try {
                const { data, error } = await _supabase.from('venues').select('*');
                
                if (error) throw error;

                const feed = document.getElementById('venue-feed');
                feed.innerHTML = ''; // Clear loading text

                data.forEach(venue => {
                    // Create Map Marker
                    const marker = L.marker([venue.latitude, venue.longitude]).addTo(map);
                    marker.bindPopup(`<b>${venue.name}</b><br>Crowd: ${venue.crowd_status}`);

                    // Create List Item below map
                    const item = document.createElement('div');
                    item.style.marginBottom = "10px";
                    item.innerHTML = `
                        <span>📍 ${venue.name} is </span>
                        <span class="status-pill ${venue.crowd_status.toLowerCase()}">${venue.crowd_status}</span>
                    `;
                    feed.appendChild(item);
                });

            } catch (err) {
                console.error("Connection Error:", err);
                document.getElementById('venue-feed').innerHTML = "Failed to load data. Ensure SQL table 'venues' exists.";
            }
        }

        getLiveUpdates();
    </script>
</body>
</html>
