<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhaNight — Ghana's #1 Nightlife Guide</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Your original GhaNight Styles */
        :root { --accent: #ffcc00; --bg: #0b0b0b; --card: #161616; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .tab-content { display: none; padding-bottom: 80px; }
        .tab-content.active { display: block; }
        
        /* The Map container - integrated into your Home layout */
        #map { height: 350px; width: calc(100% - 32px); margin: 16px; border-radius: 16px; border: 1px solid #333; z-index: 1; }
        
        /* Your original Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #111; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #666; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
        
        /* Status styling for the map list */
        .pill { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 10px; }
        .busy { background: #ff4444; }
        .normal { background: #00c851; }
    </style>
</head>
<body>

    <div id="home" class="tab-content active">
        <header style="padding: 20px;">
            <h1 style="color: var(--accent); margin: 0;">GhaNight</h1>
            <p style="font-size: 14px; color: #888;">Live Accra Vibes</p>
        </header>

        <div id="map"></div>

        <div id="venue-list" style="padding: 0 20px;">
            <h3 style="font-size: 16px;">Live Status</h3>
            </div>
    </div>

    <div id="explore" class="tab-content">
        <header style="padding: 20px;"><h1>Explore</h1></header>
        <div style="padding: 20px;">Search for clubs, bars, and lounges...</div>
    </div>

    <div id="profile" class="tab-content">
        <header style="padding: 20px;"><h1>Your Profile</h1></header>
        <div style="padding: 20px; text-align: center;">
            <div style="width: 100px; height: 100px; background: #333; border-radius: 50%; margin: 0 auto 20px;"></div>
            <h2>Kenpatsi Tech</h2>
            <p>Accra Nightlife Member</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><span class="nav-icon">🏠</span>Home</div>
        <div class="nav-item" onclick="switchTab('explore')"><span class="nav-icon">🔍</span>Explore</div>
        <div class="nav-item" onclick="switchTab('profile')"><span class="nav-icon">👤</span>Profile</div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Connection
        const supabaseUrl = 'https://lkuprzwbscuaitktlhrp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdXByendic2N1YWl0a3RsaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzcxNzgsImV4cCI6MjA5MzY1MzE3OH0.u4ptPk9lbFhAzw4HoHl5uyffgG9RMkev6ktUyu9VZfg';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Tab Switching (Keeps your app navigating)
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // Map resize fix (crucial for Leaflet inside tabs)
            if(id === 'home') { setTimeout(() => { map.invalidateSize() }, 100); }
        }

        // 3. Map Initialization
        const map = L.map('map').setView([5.5582, -0.1855], 14); // Centered on Osu
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 4. Data Fetching
        async function loadVenues() {
            const { data, error } = await _supabase.from('venues').select('*');
            if (error) return;

            const list = document.getElementById('venue-list');
            
            data.forEach(v => {
                // Pin on map
                L.marker([v.latitude, v.longitude]).addTo(map)
                 .bindPopup(`<b>${v.name}</b><br>${v.crowd_status}`);

                // Text entry below map
                const row = document.createElement('div');
                row.style.background = '#1a1a1a';
                row.style.padding = '12px';
                row.style.marginBottom = '8px';
                row.style.borderRadius = '8px';
                row.innerHTML = `📍 ${v.name} <span class="pill ${v.crowd_status.toLowerCase()}">${v.crowd_status}</span>`;
                list.appendChild(row);
            });
        }

        loadVenues();
    </script>
</body>
</html>
