<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — GhaNight</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080810;--card:#14142a;--gold:#f5c542;--orange:#ff6b35;--pink:#ff3d8a;--green:#39e07a;--text:#f0f0f8;--muted:#7070a0;--border:rgba(255,255,255,0.06);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;width:100%;max-width:400px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:6px;text-align:center;}
  .title{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;text-align:center;margin-bottom:4px;}
  .subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;}
  .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .form-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .form-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 14px;border-radius:11px;outline:none;transition:border-color 0.2s;width:100%;}
  .form-input:focus{border-color:rgba(245,197,66,0.4);}
  .btn{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;border:none;border-radius:12px;padding:14px;font-family:'DM Sans',sans-serif;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:4px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .msg{font-size:13px;text-align:center;margin-top:12px;padding:10px;border-radius:8px;display:none;}
  .msg.success{background:rgba(57,224,122,0.12);color:var(--green);border:1px solid rgba(57,224,122,0.3);}
  .msg.error{background:rgba(255,61,138,0.12);color:var(--pink);border:1px solid rgba(255,61,138,0.3);}
  .strength-bar{height:4px;border-radius:2px;margin-top:4px;background:var(--border);overflow:hidden;}
  .strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;}
  .strength-label{font-size:11px;margin-top:3px;}
  .back-link{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:13px;text-decoration:none;}
  .back-link:hover{color:var(--gold);}
  .loading{text-align:center;padding:20px;color:var(--muted);font-size:13px;}
  .icon{font-size:48px;text-align:center;margin-bottom:12px;}
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="logo">GhaNight</div>
  <div id="cardContent">
    <div class="loading">Verifying reset link...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lkuprzwbscuaitktlhrp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrdXByendic2N1YWl0a3RsaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzcxNzgsImV4cCI6MjA5MzY1MzE3OH0.u4ptPk9lbFhAzw4HoHl5uyffgG9RMkev6ktUyu9VZfg';

let db = null;
let sessionReady = false;

window.addEventListener('load', async () => {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Listen for auth state — Supabase auto-processes the token from URL hash
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Token valid — show the new password form
      sessionReady = true;
      showResetForm();
    } else if (event === 'SIGNED_IN' && sessionReady) {
      // Already handled
    } else if (!session) {
      // No session and no recovery event — link is invalid or expired
      setTimeout(() => {
        if (!sessionReady) showExpiredMessage();
      }, 2000);
    }
  });

  // Fallback: check after 3s if nothing happened
  setTimeout(() => {
    if (!sessionReady) showExpiredMessage();
  }, 3000);
});

function showResetForm() {
  document.getElementById('cardContent').innerHTML = `
    <div class="title">Set New Password</div>
    <div class="subtitle">Choose a strong password for your GhaNight account</div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <input class="form-input" id="newPass" type="password"
        placeholder="Min 8 characters"
        oninput="checkStrength(this.value)"
        autocomplete="new-password">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%"></div></div>
      <div class="strength-label" id="strengthLabel" style="color:var(--muted)"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input class="form-input" id="confirmPass" type="password"
        placeholder="Repeat your new password"
        autocomplete="new-password">
    </div>
    <button class="btn" id="resetBtn" onclick="submitReset()">Set New Password →</button>
    <div class="msg" id="resetMsg"></div>
  `;
}

function checkStrength(pass) {
  const fill  = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (!fill || !label) return;

  let score = 0;
  if (pass.length >= 8)               score++;
  if (pass.length >= 12)              score++;
  if (/[A-Z]/.test(pass))            score++;
  if (/[0-9]/.test(pass))            score++;
  if (/[^A-Za-z0-9]/.test(pass))    score++;

  const levels = [
    { pct:'0%',   color:'transparent', text:'' },
    { pct:'25%',  color:'var(--pink)',  text:'Weak' },
    { pct:'50%',  color:'var(--orange)',text:'Fair' },
    { pct:'75%',  color:'var(--gold)',  text:'Good' },
    { pct:'100%', color:'var(--green)', text:'Strong ✅' },
  ];

  const level = levels[Math.min(score, 4)];
  fill.style.width      = level.pct;
  fill.style.background = level.color;
  label.textContent     = level.text;
  label.style.color     = level.color;
}

async function submitReset() {
  const newPass     = document.getElementById('newPass')?.value;
  const confirmPass = document.getElementById('confirmPass')?.value;
  const msg         = document.getElementById('resetMsg');
  const btn         = document.getElementById('resetBtn');

  if (!newPass || !confirmPass) {
    showMsg('Please fill in both fields.', 'error'); return;
  }
  if (newPass.length < 8) {
    showMsg('Password must be at least 8 characters.', 'error'); return;
  }
  if (newPass !== confirmPass) {
    showMsg('Passwords do not match.', 'error'); return;
  }

  btn.disabled    = true;
  btn.textContent = 'Updating...';

  const { error } = await db.auth.updateUser({ password: newPass });

  if (error) {
    btn.disabled    = false;
    btn.textContent = 'Set New Password →';
    showMsg('⚠️ ' + error.message, 'error');
    return;
  }

  // Success
  document.getElementById('cardContent').innerHTML = `
    <div class="icon">🎉</div>
    <div class="title">Password Updated!</div>
    <div class="subtitle" style="margin-bottom:24px">
      Your password has been changed successfully.<br>
      You can now log in with your new password.
    </div>
    <a href="index.html" class="btn" style="text-decoration:none;display:block;text-align:center;">
      Back to GhaNight →
    </a>
  `;
}

function showExpiredMessage() {
  if (sessionReady) return;
  document.getElementById('cardContent').innerHTML = `
    <div class="icon">⏳</div>
    <div class="title">Link Expired</div>
    <div class="subtitle" style="margin-bottom:24px">
      This password reset link has expired or already been used.<br>
      Reset links are valid for 1 hour.
    </div>
    <button class="btn" onclick="requestNewLink()">Request New Link</button>
    <div class="msg" id="resetMsg"></div>
    <a href="index.html" class="back-link">← Back to GhaNight</a>
  `;
}

async function requestNewLink() {
  const email = prompt('Enter your email address:');
  if (!email) return;
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://kenpatsi-tech.github.io/Ghnightlife-guide/reset-password.html'
  });
  if (error) {
    showMsg('⚠️ ' + error.message, 'error');
  } else {
    showMsg('✅ New reset link sent! Check your inbox.', 'success');
  }
}

function showMsg(text, type) {
  const msg = document.getElementById('resetMsg');
  if (!msg) return;
  msg.textContent  = text;
  msg.className    = 'msg ' + type;
  msg.style.display = 'block';
}
</script>
</body>
</html>
