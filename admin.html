<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhaNight Admin — Control Panel</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#080810;--surface:#10101e;--card:#14142a;--gold:#f5c542;--orange:#ff6b35;--pink:#ff3d8a;--green:#39e07a;--blue:#4fa3ff;--purple:#a855f7;--text:#f0f0f8;--muted:#7070a0;--border:rgba(255,255,255,0.08);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;}

  /* LOGIN */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;}
  .login-logo{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}

  /* LAYOUT */
  .admin-wrap{display:none;min-height:100vh;}
  .admin-wrap.visible{display:flex;flex-direction:column;}
  .admin-header{background:rgba(8,8,16,0.98);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .admin-logo{font-size:16px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .admin-body{display:flex;flex:1;min-height:0;}

  /* SIDEBAR */
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto;}
  .sidebar-section{padding:8px 16px 4px;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
  .sidebar-item{display:flex;align-items:center;gap:9px;padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;transition:all 0.15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
  .sidebar-item:hover,.sidebar-item.active{background:rgba(245,197,66,0.07);color:var(--gold);}
  .sidebar-item .icon{font-size:15px;width:18px;text-align:center;}
  .sidebar-item .count{margin-left:auto;background:var(--pink);color:white;font-size:10px;font-weight:700;padding:1px 6px;border-radius:100px;}

  /* MAIN */
  .main-content{flex:1;padding:24px;overflow-y:auto;}
  .page-title{font-size:20px;font-weight:800;margin-bottom:6px;}
  .page-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}

  /* STATS */
  .stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;}
  .stat-num{font-size:28px;font-weight:800;color:var(--gold);margin-bottom:2px;}
  .stat-label{font-size:11px;color:var(--muted);}

  /* TABLE */
  .table-wrap{overflow-x:auto;}
  .data-table{width:100%;border-collapse:collapse;margin-bottom:24px;min-width:500px;}
  .data-table th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);}
  .data-table td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px;vertical-align:middle;}
  .data-table tr:hover td{background:rgba(255,255,255,0.02);}

  /* BADGES */
  .badge{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:600;white-space:nowrap;}
  .bg{background:rgba(57,224,122,0.15);color:var(--green);}
  .bp{background:rgba(255,61,138,0.15);color:var(--pink);}
  .bo{background:rgba(245,197,66,0.15);color:var(--gold);}
  .bb{background:rgba(79,163,255,0.15);color:var(--blue);}
  .bm{background:rgba(255,255,255,0.06);color:var(--muted);}
  .bpu{background:rgba(168,85,247,0.15);color:var(--purple);}

  /* BUTTONS */
  .btn{border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit;white-space:nowrap;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;}
  .btn-green{background:rgba(57,224,122,0.15);color:var(--green);border:1px solid rgba(57,224,122,0.3);}
  .btn-danger{background:rgba(255,61,138,0.15);color:var(--pink);border:1px solid rgba(255,61,138,0.3);}
  .btn-muted{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);}
  .btn-blue{background:rgba(79,163,255,0.15);color:var(--blue);border:1px solid rgba(79,163,255,0.3);}
  .btn-purple{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.3);}
  .btn-lg{padding:11px 20px;font-size:14px;border-radius:11px;}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group.full{grid-column:1/-1;}
  .form-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .form-input,.form-select,.form-textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;padding:9px 12px;border-radius:9px;outline:none;transition:border-color 0.2s;width:100%;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(245,197,66,0.4);}
  .form-textarea{min-height:100px;resize:vertical;}

  /* PANEL SECTIONS */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
  .panel-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-title-left{display:flex;align-items:center;gap:8px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
  .modal-title{font-size:18px;font-weight:800;margin-bottom:16px;}

  /* CARD ROWS */
  .card-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;}
  .card-row-title{font-size:14px;font-weight:700;margin-bottom:4px;}
  .card-row-meta{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
  .card-row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* TOKEN GENERATOR */
  .token-display{background:var(--surface);border:2px solid rgba(57,224,122,0.3);border-radius:12px;padding:16px;text-align:center;margin:12px 0;}
  .token-code{font-family:'Courier New',monospace;font-size:22px;font-weight:800;color:var(--green);letter-spacing:4px;margin-bottom:6px;}
  .token-meta{font-size:12px;color:var(--muted);}

  /* HEAT BAR */
  .heat-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;width:70px;display:inline-block;vertical-align:middle;margin-right:5px;overflow:hidden;}
  .heat-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--orange));}

  /* TOAST */
  .toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 16px;font-size:13px;opacity:0;transition:all 0.25s;z-index:600;pointer-events:none;}
  .toast.show{opacity:1;}

  @media(max-width:768px){.sidebar{display:none;}.form-grid{grid-template-columns:1fr;}.form-group.full{grid-column:1;}.stats-row{grid-template-columns:1fr 1fr;}}
  @media(max-width:768px){.sidebar.mobile-open{display:block;position:fixed;top:54px;left:0;bottom:0;z-index:200;width:240px;overflow-y:auto;}}
  .mobile-menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;}
  @media(max-width:768px){.mobile-menu-btn{display:block;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">GhaNight</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:24px">Admin Control Panel — Authorised access only</div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="loginEmail" type="email" placeholder="admin@ghanight.com" autocomplete="email"></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="loginPass" type="password" placeholder="Password" autocomplete="current-password"></div>
      <button class="btn btn-gold btn-lg" style="width:100%" onclick="adminLogin()">Log In →</button>
      <div id="loginErr" style="color:var(--pink);font-size:12px;text-align:center;display:none"></div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="admin-logo">GhaNight Admin</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" target="_blank" style="color:var(--muted);font-size:12px;text-decoration:none">View Site ↗</a>
      <span id="adminEmail" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn btn-muted" onclick="adminLogout()">Log Out</button>
    </div>
  </div>
  <div class="admin-body">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">Overview</div>
      <button class="sidebar-item active" onclick="show('overview',this)"><span class="icon">📊</span>Dashboard</button>

      <div class="sidebar-section">Nightlife</div>
      <button class="sidebar-item" onclick="show('venues',this)"><span class="icon">🏛️</span>Venues</button>
      <button class="sidebar-item" onclick="show('events',this)"><span class="icon">🎉</span>Events</button>

      <div class="sidebar-section">Creators</div>
      <button class="sidebar-item" onclick="show('posts',this)"><span class="icon">✍️</span>Blog Posts<span class="count" id="pendingPostsBadge" style="display:none">0</span></button>

      <div class="sidebar-section">Gaming</div>
      <button class="sidebar-item" onclick="show('predictions',this)"><span class="icon">🔮</span>Predictions</button>
      <button class="sidebar-item" onclick="show('leaderboard',this)"><span class="icon">🏆</span>Leaderboard</button>
      <button class="sidebar-item" onclick="show('rewards',this)"><span class="icon">🎁</span>Reward Claims</button>

      <div class="sidebar-section">Corporate</div>
      <button class="sidebar-item" onclick="show('tokens',this)"><span class="icon">🎫</span>Vendor Tokens</button>
      <button class="sidebar-item" onclick="show('subscriptions',this)"><span class="icon">🏢</span>Subscriptions</button>
      <button class="sidebar-item" onclick="show('vendors',this)"><span class="icon">🏪</span>Vendor Apps<span class="count" id="vendorBadge" style="display:none">0</span></button>
      <button class="sidebar-item" onclick="show('corpEnquiries',this)"><span class="icon">📋</span>Corp Enquiries<span class="count" id="corpBadge" style="display:none">0</span></button>

      <div class="sidebar-section">Business</div>
      <button class="sidebar-item" onclick="show('registrations',this)"><span class="icon">📝</span>Venue Regs<span class="count" id="regBadge" style="display:none">0</span></button>
      <button class="sidebar-item" onclick="show('adEnquiries',this)"><span class="icon">📩</span>Ad Enquiries<span class="count" id="adBadge" style="display:none">0</span></button>

      <div class="sidebar-section">Users</div>
      <button class="sidebar-item" onclick="show('checkins',this)"><span class="icon">📍</span>Check-ins</button>
      <button class="sidebar-item" onclick="show('users',this)"><span class="icon">👥</span>Users</button>
    </div>

    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<!-- UNIVERSAL MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box"><div class="modal-title" id="modalTitle"></div><div id="modalBody"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://lkuprzwbscuaitktlhrp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fA03kKrp9WRnU0xqH2fl_A_J8pmLVtU';
let db = null, adminUser = null, editId = null, editType = null;

window.addEventListener('load', async () => {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data:{ session } } = await db.auth.getSession();
  if (session) { adminUser = session.user; showAdmin(); }
});

// ── AUTH ──────────────────────────────────────────────
async function adminLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const err   = document.getElementById('loginErr');
  err.style.display = 'none';
  const { data, error } = await db.auth.signInWithPassword({ email, password:pass });
  if (error) { err.textContent='Incorrect email or password'; err.style.display='block'; return; }
  adminUser = data.user;
  showAdmin();
}
async function adminLogout() {
  await db.auth.signOut();
  location.reload();
}
function showAdmin() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminWrap').classList.add('visible');
  document.getElementById('adminEmail').textContent = adminUser.email;
  show('overview', document.querySelector('.sidebar-item'));
  loadBadges();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
}

// ── BADGES ────────────────────────────────────────────
async function loadBadges() {
  const checks = [
    { table:'creator_posts', filter:{status:'pending'}, badge:'pendingPostsBadge' },
    { table:'vendor_applications', filter:{status:'pending'}, badge:'vendorBadge' },
    { table:'corporate_enquiries', filter:{status:'new'}, badge:'corpBadge' },
    { table:'venue_registrations', filter:{status:'pending'}, badge:'regBadge' },
    { table:'advertiser_enquiries', filter:{status:'new'}, badge:'adBadge' },
  ];
  for (const c of checks) {
    try {
      let q = db.from(c.table).select('*',{count:'exact',head:true});
      for (const [k,v] of Object.entries(c.filter)) q = q.eq(k,v);
      const { count } = await q;
      if (count > 0) {
        const el = document.getElementById(c.badge);
        if (el) { el.textContent = count; el.style.display = 'block'; }
      }
    } catch(e){}
  }
}

// ── NAVIGATION ────────────────────────────────────────
function show(section, btn) {
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const map = {
    overview:renderOverview, venues:renderVenues, events:renderEvents,
    posts:renderPosts, predictions:renderPredictions, leaderboard:renderLeaderboard,
    rewards:renderRewards, tokens:renderTokens, subscriptions:renderSubscriptions,
    vendors:renderVendors, corpEnquiries:renderCorpEnquiries,
    registrations:renderRegistrations, adEnquiries:renderAdEnquiries,
    checkins:renderCheckins, users:renderUsers
  };
  if (map[section]) map[section]();
}

// ── OVERVIEW ──────────────────────────────────────────
async function renderOverview() {
  const el = document.getElementById('mainContent');
  el.innerHTML = '<div style="color:var(--muted)">Loading...</div>';
  const today = new Date(); today.setHours(0,0,0,0);
  const queries = [
    db.from('venues').select('*',{count:'exact',head:true}).eq('active',true),
    db.from('events').select('*',{count:'exact',head:true}).eq('active',true),
    db.from('checkins').select('*',{count:'exact',head:true}).gte('checked_in_at',today.toISOString()),
    db.from('user_profiles').select('*',{count:'exact',head:true}),
    db.from('creator_posts').select('*',{count:'exact',head:true}).eq('status','pending'),
    db.from('vendor_applications').select('*',{count:'exact',head:true}).eq('status','pending'),
    db.from('corporate_subscriptions').select('*',{count:'exact',head:true}).eq('status','active'),
    db.from('venue_registrations').select('*',{count:'exact',head:true}).eq('status','pending'),
  ];
  const results = await Promise.allSettled(queries);
  const get = i => results[i].value?.count || 0;
  el.innerHTML = `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Welcome back. Here's what's happening on GhaNight right now.</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${get(0)}</div><div class="stat-label">Active Venues</div></div>
      <div class="stat-card"><div class="stat-num">${get(1)}</div><div class="stat-label">Active Events</div></div>
      <div class="stat-card"><div class="stat-num">${get(2)}</div><div class="stat-label">Check-ins Today</div></div>
      <div class="stat-card"><div class="stat-num">${get(3)}</div><div class="stat-label">Registered Users</div></div>
      <div class="stat-card" style="border-color:rgba(168,85,247,0.3)"><div class="stat-num" style="color:var(--purple)">${get(4)}</div><div class="stat-label">Posts Pending Review</div></div>
      <div class="stat-card" style="border-color:rgba(57,224,122,0.3)"><div class="stat-num" style="color:var(--green)">${get(6)}</div><div class="stat-label">Active Corp Subs</div></div>
      <div class="stat-card" style="border-color:rgba(255,61,138,0.3)"><div class="stat-num" style="color:var(--pink)">${get(5)}</div><div class="stat-label">Vendor Apps Pending</div></div>
      <div class="stat-card" style="border-color:rgba(245,197,66,0.3)"><div class="stat-num" style="color:var(--orange)">${get(7)}</div><div class="stat-label">Venue Regs Pending</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Quick Actions</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold" onclick="show('venues',null);setTimeout(()=>openVenueForm({}),100)">+ Add Venue</button>
        <button class="btn btn-gold" onclick="show('events',null);setTimeout(()=>openEventForm({}),100)">+ Add Event</button>
        <button class="btn btn-green" onclick="show('tokens',null);setTimeout(generateToken,100)">🎫 Generate Token</button>
        <button class="btn btn-purple" onclick="show('posts',null)">✍️ Review Posts (${get(4)})</button>
        <button class="btn btn-blue" onclick="show('vendors',null)">🏪 Vendor Apps (${get(5)})</button>
      </div>
    </div>`;
}

// ── VENUES ────────────────────────────────────────────
async function renderVenues() {
  const el = document.getElementById('mainContent');
  el.innerHTML = '<div style="color:var(--muted)">Loading...</div>';
  const { data } = await db.from('venues').select('*').order('premium',{ascending:false}).order('heat',{ascending:false});
  el.innerHTML = `
    <div class="page-title">Venues</div>
    <div class="page-sub">Add, edit, hide or delete venues. Changes appear on the site instantly.</div>
    <div class="panel">
      <div class="panel-title"><span>All Venues (${(data||[]).length})</span><button class="btn btn-gold" onclick="openVenueForm({})">+ Add Venue</button></div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Name</th><th>Area</th><th>Type</th><th>Heat</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${(data||[]).map(v=>`<tr>
            <td><strong>${v.name}</strong>${v.premium?' <span class="badge bo">Featured</span>':''}</td>
            <td>${v.area}</td><td><span class="badge bm">${v.type}</span></td>
            <td><span class="heat-bar"><span class="heat-fill" style="width:${v.heat}%"></span></span>${v.heat}%</td>
            <td><span class="badge ${v.active?'bg':'bp'}">${v.active?'Active':'Hidden'}</span></td>
            <td style="display:flex;gap:5px;flex-wrap:wrap">
              <button class="btn btn-muted" onclick='openVenueForm(${JSON.stringify(v)})'>Edit</button>
              <button class="btn ${v.active?'btn-muted':'btn-green'}" onclick="toggleRow('venues','${v.id}',${!v.active})">${v.active?'Hide':'Show'}</button>
              <button class="btn btn-danger" onclick="deleteRow('venues','${v.id}','${v.name}')">Delete</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

function openVenueForm(v) {
  editId = v.id||null; editType = 'venue';
  document.getElementById('modalTitle').textContent = v.id ? 'Edit Venue' : 'Add New Venue';
  document.getElementById('modalBody').innerHTML = `
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">Venue Name *</label><input class="form-input" id="vname" value="${v.name||''}" placeholder="e.g. Onyx Nightclub"></div>
      <div class="form-group"><label class="form-label">Area *</label>
        <select class="form-select" id="varea">${['East Legon','Airport Hills','Osu','Cantonments','La / Labadi','Accra CBD','Tema','Other'].map(a=>`<option ${v.area===a?'selected':''}>${a}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Type *</label>
        <select class="form-select" id="vtype">${['club','lounge','rooftop','beach','concert','bar'].map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Entry Price</label><input class="form-input" id="ventry" value="${v.entry||'Free'}" placeholder="GHS 50 or Free"></div>
      <div class="form-group"><label class="form-label">Opening Hours</label><input class="form-input" id="vtime" value="${v.time||'9pm - 2am'}"></div>
      <div class="form-group"><label class="form-label">Heat % (0–99)</label><input class="form-input" id="vheat" type="number" min="0" max="99" value="${v.heat||50}"></div>

async function markPredictionResult() {
  const predId = document.getElementById('predId').value.trim();
  const winner = parseInt(document.getElementById('predWinner').value);
  if (!predId) { toast('⚠️ Enter a prediction ID'); return; }
  // Get all predictions for this ID
  const { data } = await db.from('predictions').select('*').eq('prediction_id', predId);
  if (!data?.length) { toast('No predictions found for that ID'); return; }
  // Mark correct/wrong and award points
  for (const p of data) {
    const isCorrect = p.choice_index === winner;
    const pts = isCorrect ? 50 : 0;
    await db.from('predictions').update({ correct:isCorrect, pts_awarded:pts }).eq('id',p.id);
    if (isCorrect && pts > 0) {
      // Add points to user
      const { data:existing } = await db.from('user_points').select('points').eq('user_id',p.user_id).single().catch(()=>({data:null}));
      const newPts = (existing?.points||0) + pts;
      await db.from('user_points').upsert({ user_id:p.user_id, points:newPts, updated_at:new Date().toISOString() });
    }
  }
  toast(`✅ Results marked! ${data.filter(p=>p.choice_index===winner).length} correct predictors awarded 50 pts each.`);
  renderPredictions();
}

async function generateToken() {
  const vendor = document.getElementById('tvendor')?.value?.trim();
  if (!vendor) { toast('⚠️ Vendor name required'); return; }
  // Generate unique token: GHN-XXXXX-XXX
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rand = n => Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  const token = `GHN-${rand(5)}-${rand(3)}`;
  const days = parseInt(document.getElementById('tdays')?.value||'30');
  const expires = new Date(); expires.setDate(expires.getDate()+days);
  const payload = {
    token, vendor_name:vendor, org_name:document.getElementById('torg')?.value?.trim()||null,
    plan:document.getElementById('tplan')?.value||'Business',
    discount_pct:parseInt(document.getElementById('tdisc')?.value||'25'),
    used:false, expires_at:expires.toISOString()
  };
  const { error } = await db.from('vendor_tokens').insert(payload);
  if (error) { toast('⚠️ Failed to save token: '+error.message); return; }
  const el = document.getElementById('generatedToken');
  el.style.display = 'block';
  el.innerHTML = `
    <div class="token-display">
      <div class="token-code">${token}</div>
      <div class="token-meta">${payload.plan} Plan · ${payload.discount_pct}% off · Valid ${days} days · Send this to ${vendor}</div>
    </div>

}

// ── UTILS ─────────────────────────────────────────────
function g(id) { return document.getElementById(id)?.value||''; }
function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function copyEmail(email) { navigator.clipboard.writeText(email); toast('📋 '+email+' copied'); }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

async function toggleRow(table, id, active) {
  await db.from(table).update({ active, updated_at:new Date().toISOString() }).eq('id',id);
  toast(active?'✅ Now visible on site':'👁️ Hidden from site');
  if (table==='venues') renderVenues(); else renderEvents();
}
async function deleteRow(table, id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  await db.from(table).delete().eq('id',id);
  toast('🗑️ Deleted'); if (table==='venues') renderVenues(); else renderEvents();
}
